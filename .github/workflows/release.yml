name: Release image

# Manually build a console/contestant/server image, cut a GitHub release for
# it, and optionally deploy it straight to that image's Proxmox staging VM.
# Replaces the old console-v*/contestant-v* tag-push triggers: this
# workflow creates the release tag itself, pointing at whichever branch
# you dispatch it from.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build"
        required: true
        type: choice
        options:
          - console
          - contestant
          - server
      version:
        description: "Version to release, e.g. 1.4.0 (tag will be <image>-v<version>)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
        default: false
      deploy:
        description: "Deploy the built image to its Proxmox staging VM"
        required: true
        type: boolean
        default: false
      upload_to_gcs:
        description: "Upload the built image to the GCS artifact bucket"
        required: true
        type: boolean
        default: true

# Image releases queue instead of racing: build-image.yml runs on the single
# self-hosted nix-builder, and two concurrent releases would fight it (and
# each other's Proxmox deploy step). Deliberately no cancel-in-progress -
# cancelling a half-finished release can leave a tag, a GitHub release, or a
# partially uploaded artifact behind. The group lives here rather than in
# build-image.yml so the caller and callee can't wait on each other.
concurrency:
  group: image-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ inputs.image }}
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      deploy: ${{ inputs.deploy }}
      upload_to_gcs: ${{ inputs.upload_to_gcs }}
    secrets: inherit
