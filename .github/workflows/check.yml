name: Check

# Validates that the flake evaluates and both system configurations build,
# so a commit is known-good before it gets tagged for an image release.
#
# Runner requirements: same self-hosted "nix-builder" runner used by
# build-image.yml (Nix with flakes + nix-command enabled).

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, nix-builder]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flake check
        run: nix flake check -L

      - name: Build console system closure
        run: nix build .#nixosConfigurations.console.config.system.build.toplevel -L --no-link

      - name: Build contestant system closure
        run: nix build .#nixosConfigurations.contestant.config.system.build.toplevel -L --no-link

  vm-tests:
    # Separate from `check` so a failing nixosTest (a real VM boot + service
    # checks, slower than the steps above) never blocks that job, and never
    # blocks deploy either - release.yml/build-image.yml don't depend on
    # this workflow at all. Manual-only (not run on every push): building
    # the full contestant image for a VM boot is slow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, nix-builder]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run contestant VM tests
        run: nix build .#contestant-vm-tests -L

      - name: Run console VM tests
        run: nix build .#console-vm-tests -L
